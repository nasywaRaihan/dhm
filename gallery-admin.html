<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DHM Admin | Tambah Gallery</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- BASE -->
    <link rel="stylesheet" href="assets/css/base.css" />

    <!-- TOM SELECT -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet" />

    <!-- FLATPICKR -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />

    <!-- PAGE CSS -->
    <link rel="stylesheet" href="assets/css/admin-sidebar.css" />
    <link rel="stylesheet" href="assets/css/gallery-admin.css" />
  </head>

  <body>
    <div class="gallery-admin-layout">
      <!-- SIDEBAR -->
      <aside class="gallery-sidebar">
        <div class="gallery-sidebar-logo">
          <h2>DHM Admin</h2>
        </div>

        <div class="sidebar-user">
          <div class="sidebar-avatar">A</div>

          <div>
            <h4>Admin DHM</h4>
            <p>Super Admin</p>
          </div>
        </div>

        <nav class="gallery-sidebar-menu">
          <a href="dashboard.html"> Dashboard </a>

          <a href="gallery-admin.html" class="active"> Tambah Gallery </a>

          <a href="#" id="logoutBtn"> Logout </a>
        </nav>
      </aside>

      <!-- MAIN -->
      <main class="gallery-admin-main">
        <!-- HEADER -->
        <div class="gallery-admin-header">
          <div>
            <span class="breadcrumb"> Dashboard / Gallery </span>

            <h1>Tambah Gallery</h1>

            <p>Tambahkan dokumentasi kegiatan DHM</p>
          </div>

          <div class="header-badge">Active</div>
        </div>

        <!-- FORM BOX -->
        <div class="gallery-form-box">
          <div class="form-section-title">Informasi Gallery</div>

          <form id="galleryForm">
            <!-- TITLE -->
            <div class="form-group">
              <label> Judul Gallery </label>

              <input type="text" id="galleryTitle" placeholder="Masukkan judul gallery" required />
            </div>

            <!-- ROW -->
            <div class="form-row">
              <!-- CATEGORY -->
              <div class="form-group">
                <div class="field-top">
                  <label> Kategori Gallery </label>

                  <span> Wajib </span>
                </div>

                <select id="galleryCategory" required>
                  <option value="">Pilih Kategori</option>

                  <option value="Festival">Festival</option>

                  <option value="Kajian">Kajian</option>

                  <option value="Pengajian">Pengajian</option>

                  <option value="Dauroh">Dauroh</option>
                </select>
              </div>

              <!-- DIVISION -->
              <div class="form-group">
                <div class="field-top">
                  <label> Divisi </label>

                  <span> Wajib </span>
                </div>

                <select id="galleryDivision" required>
                  <option value="">Pilih Divisi</option>

                  <option value="PH">PH</option>

                  <option value="HUMMED">HUMMED</option>

                  <option value="PS">PS</option>

                  <option value="PM">PM</option>

                  <option value="PSDI">PSDI</option>
                </select>
              </div>
            </div>

            <!-- ROW -->
            <div class="form-row">
              <!-- DATE -->
              <div class="form-group">
                <div class="field-top">
                  <label> Tanggal Kegiatan </label>

                  <span> Wajib </span>
                </div>

                <input type="text" id="galleryDate" placeholder="Pilih tanggal kegiatan" required />
              </div>

              <!-- THUMB -->
              <div class="form-group">
                <label> Thumbnail </label>

                <div class="upload-box">
                  <input type="file" id="galleryThumbnail" accept="image/*" hidden />

                  <label for="galleryThumbnail" class="upload-label">
                    <span class="upload-icon"> ⬆ </span>

                    <p>Upload Thumbnail</p>

                    <small> PNG, JPG, WEBP • Max 2MB </small>
                  </label>
                </div>
              </div>
            </div>

            <!-- PREVIEW -->
            <img id="thumbnailPreview" class="thumbnail-preview" alt="Thumbnail Preview" />

            <!-- DESCRIPTION -->
            <div class="form-group">
              <label> Deskripsi </label>

              <textarea id="galleryDesc" placeholder="Masukkan deskripsi gallery" required></textarea>
            </div>

            <!-- BUTTON -->
            <button type="submit" class="submit-gallery-btn">
              <span> Simpan Gallery </span>
            </button>
          </form>
        </div>
      </main>
    </div>

    <!-- DATA -->
    <script src="assets/js/data.js"></script>

    <!-- TOM SELECT -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

    <!-- FLATPICKR -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <!-- JS -->
    <script src="assets/js/gallery-admin.js"></script>
    <script src="assets/js/admin-logout.js"></script>

    <div class="logout-popup" id="logoutPopup">
      <div class="logout-popup-content">
        <h3>Logout Dashboard</h3>

        <p>Apakah kamu yakin ingin keluar dari dashboard admin?</p>

        <div class="logout-actions">
          <button id="cancelLogout" class="cancel-btn">Batal</button>

          <button id="confirmLogout" class="confirm-btn">Ya, Logout</button>
        </div>
      </div>
    </div>
  </body>
</html>
