<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gallery Detail</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/navbar.css" />
    <link rel="stylesheet" href="assets/css/popup.css" />
    <link rel="stylesheet" href="assets/css/footer.css" />
    <link rel="stylesheet" href="assets/css/gallery-detail.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <div class="logo">
        <img src="assets/img/logo_dhm.png" class="logo-icon" alt="logo dhm" />
        <span class="logo-text">DAKWAH HIJRAH MAHASISWA</span>
      </div>

      <div class="menu-toggle" id="menuToggle">
        <span></span>
        <span></span>
      </div>

      <nav id="navMenu">
        <a href="index.html">Home</a>
        <a href="gallery.html" class="active">Gallery</a>

        <a href="#login" class="admin-link">Login Admin</a>
      </nav>
    </header>

    <!-- MAIN -->
    <main>
      <!-- DETAIL -->
      <section class="gallery-detail-section">
        <div class="gallery-detail-container">
          <!-- HERO -->
          <div class="gallery-detail-image">
            <img id="detailImage" />
          </div>

          <!-- INFO -->
          <div class="gallery-detail-content">
            <span class="detail-meta">
              <span id="detailDate"></span>
              •
              <span id="detailDivision"></span>
            </span>

            <h1 id="detailTitle"></h1>

            <div id="detailDesc"></div>

            <button class="share-btn" id="shareBtn">🔗 Bagikan</button>
          </div>

          <!-- Divider -->

          <div class="detail-gallery">
            <h2>📸 Dokumentasi Kegiatan</h2>

            <div class="detail-gallery-slider">
              <div class="detail-gallery-track" id="detailGalleryImages"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer>
      <p>© 2026 Dakwah Hijrah Mahasiswa UII</p>
    </footer>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/gallery-service.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/login.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/gallery-detail.js"></script>

    <!-- LOGIN POPUP -->
    <div class="login-popup" id="loginPopup">
      <div class="login-popup-content">
        <!-- CLOSE -->
        <button class="login-close" id="closeLogin">✕</button>

        <!-- HEADER -->
        <div class="login-header">
          <h2>Admin Login</h2>

          <p>Masuk untuk mengelola website DHM</p>
        </div>

        <!-- FORM -->
        <form class="login-form" id="loginForm">
          <!-- EMAIL -->
          <div class="login-group">
            <label>Email</label>

            <input type="email" id="loginEmail" placeholder="Masukkan email" required />
          </div>

          <!-- PASSWORD -->
          <div class="login-group">
            <label>Password</label>

            <input type="password" id="loginPassword" placeholder="Masukkan password" required />
          </div>

          <!-- REMEMBER -->
          <div class="login-options">
            <label class="remember-me">
              <input type="checkbox" />

              <span>Remember me</span>
            </label>
          </div>

          <!-- BUTTON -->
          <button type="submit" class="login-btn">Login Sekarang</button>
        </form>
      </div>
    </div>
  </body>
</html>
